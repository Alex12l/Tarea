<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.4.0/lib/p5.js"></script>

    <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>

    <script>
      //paso 1
      let circles = [];
      let squares = [];
      let triangles = [];
      let shapeClassifier; //ML5

      //paso 2: Carga de las imagenes
      function preload() {
        for (let i = 0; i < 100; i++) {
          let index = nf(i + 1, 3, 0);

          circles[i] = loadImage(`data/circle${index}.png`);
          squares[i] = loadImage(`data/square${index}.png`);
          triangles[i] = loadImage(`data/triangle${index}.png`);
        }
      }

      //Se construira la configuracion para el entrenamiento
      function setup() {
        let options = {
          inputs: [64, 64, 4],
          task: "imageClassification",
          debug: true,
        };

        //inicializamos la red neuronal
        shapeClassifier = ml5.neuralNetwork(options);

        //Datos de entrenamiento
        for (let i = 0; i < 100; i++) {
          //Agregar: Circulos
          shapeClassifier.addData({ image: circles[i] }, { label: "Circulo" });
          //Agregar: Cuadrados
          shapeClassifier.addData({ image: squares[i] }, { label: "Cuadrado" });
          //Agregar: Triangulos
          shapeClassifier.addData(
            { image: triangles[i] },
            { label: "Triangulo" },
          );
        }
        // Al final de setup(), después del bucle for:
        shapeClassifier.normalizeData();
        shapeClassifier.train({ epochs: 50 }, finishedTraining);
      }

      //Cuando finalice el entrenamiento guardamos : 2 (JSON), 1(BIN)
      function finishedTraining() {
        console.log("Entrenamiento finalizado");
        shapeClassifier.save();
      }
    </script>
  </body>
</html>
